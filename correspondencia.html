<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Correspondencia — Dirección de Atención Médica</title>
<link rel="icon" type="image/png" href="Salud%20Logo.png">
<link rel="apple-touch-icon" href="Salud%20Logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Archivos DAM">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#00655F">
<style>
  html, body { margin:0; padding:0; height:100%; background:#F4F7F6; font-family:Arial,Helvetica,sans-serif; }
  iframe { position:fixed; inset:0; width:100vw; height:100vh; border:0; display:none; }
  #error { display:none; text-align:center; padding:60px 20px; color:#555; max-width:480px; margin:0 auto; }
  #error h2 { color:#AE1F2D; margin-bottom:10px; }
</style>
</head>
<body>
  <div id="error">
    <h2>Enlace incompleto</h2>
    <p>A este enlace le falta el código de acceso. Pide el enlace correcto a quien administra el sistema — no lo escribas de memoria ni lo adivines.</p>
  </div>
  <iframe id="app" title="Correspondencia — Dirección de Atención Médica"></iframe>
  <script>
    // Esta página solo es un "envoltorio" para que el ícono de la pestaña y el de
    // instalación sean los correctos (Apps Script no permite cambiar su propio ícono).
    // El código de acceso NUNCA se guarda en este archivo: se toma tal cual venga en
    // la URL con la que se abrió esta página, y se reenvía dentro del iframe. Así, este
    // archivo puede vivir en un repositorio público de GitHub sin exponer ningún token.
    var APP_BASE = 'https://script.google.com/macros/s/AKfycbzJYPjnnFpB-IZRJLrZOhsm7hlg5sXny-ACPe6CoRSb9W7YDP2GwqYhVkZfMOuRGv0/exec';
    var qs = location.search;
    if (qs && qs.indexOf('rol=') !== -1) {
      var iframe = document.getElementById('app');
      iframe.src = APP_BASE + qs;
      iframe.style.display = 'block';
    } else {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
